<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Diagnostic Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #instructions {
      position: absolute; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 14px; z-index: 999;
    }
    #instructions a { color: #7dd3fc; }
  </style>
</head>
<body>

  <div id="instructions">
    🩺 Diagnostic test: custom targets.mind + procedural heart (no GLB).
    <a href="din-target.jpg" target="_blank">
      Open the marker image here
    </a>
  </div>

  <script>
    // Procedural heart geometry — no external file dependency, so if this
    // doesn't show up, the problem is target detection, not the 3D model.
    AFRAME.registerGeometry('heart', {
      schema: {
        depth: { type: 'number', default: 2 },
        scale: { type: 'number', default: 0.05 }
      },
      init: function (data) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0, -3, -6, -3, -6, 2);
        shape.bezierCurveTo(-6, 6, 0, 8, 0, 12);
        shape.bezierCurveTo(0, 8, 6, 6, 6, 2);
        shape.bezierCurveTo(6, -3, 0, -3, 0, 0);

        const extrudeSettings = {
          depth: data.depth,
          bevelEnabled: true,
          bevelThickness: 1,
          bevelSize: 1,
          bevelSegments: 3,
          curveSegments: 24
        };

        let geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();
        geometry.scale(data.scale, data.scale, data.scale);
        geometry.rotateZ(Math.PI);
        this.geometry = geometry;
      }
    });
  </script>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
    <a-light type="directional" color="#fff" intensity="0.8" position="1 1 1"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        geometry="primitive: heart"
        material="color: #e0245e; roughness: 0.35; metalness: 0.1"
        position="0 0 0.2"
        rotation="90 0 0"
        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dur: 500; dir: alternate; loop: true; easing: easeInOutSine"
      ></a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
