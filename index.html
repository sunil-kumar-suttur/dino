<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR 3D Dinosaur Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #instructions {
      position: absolute; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 14px; z-index: 999;
    }
    #instructions a { color: #7dd3fc; }
  </style>
  <script>
    // Lets you rotate the model by dragging your finger (or mouse) across the screen.
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.rotY = 0;
        this.rotX = 0;
        this.isDragging = false;
        this.lastX = 0;
        this.lastY = 0;

        const el = this.el;
        const canvas = this.el.sceneEl.canvas;

        const startDrag = (x, y) => {
          this.isDragging = true;
          this.lastX = x;
          this.lastY = y;
        };
        const moveDrag = (x, y) => {
          if (!this.isDragging) return;
          const deltaX = x - this.lastX;
          const deltaY = y - this.lastY;
          this.rotY += deltaX * 0.5;
          this.rotX += deltaY * 0.5;
          el.setAttribute('rotation', { x: this.rotX, y: this.rotY, z: 0 });
          this.lastX = x;
          this.lastY = y;
        };
        const endDrag = () => { this.isDragging = false; };

        // Touch (mobile)
        canvas.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          startDrag(t.clientX, t.clientY);
        });
        canvas.addEventListener('touchmove', (e) => {
          const t = e.touches[0];
          moveDrag(t.clientX, t.clientY);
        });
        canvas.addEventListener('touchend', endDrag);

        // Mouse (desktop testing)
        canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('mouseleave', endDrag);
      }
    });
  </script>

</head>
<body>

  <div id="instructions">
    🦖 Point your camera at the dinosaur target image.
    <a href="din-target.jpg" target="_blank">
      Open the marker image here
    </a>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!-- Make sure din.glb sits in the same folder as this HTML file when you host it -->
      <a-asset-item id="dinoModel" src="din.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
    <a-light type="directional" color="#fff" intensity="0.8" position="1 1 1"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#dinoModel"
        position="0 0 0.1"
        scale="1.2 1.2 1.2"
        rotation="0 0 0"
        drag-rotate
      ></a-gltf-model>
    </a-entity>
  </a-scene>

</body>
</html>
